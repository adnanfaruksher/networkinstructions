<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Networkinstructors Assistant</title>
<style>
  :root{
    --bg:#0B0F14; --panel:#111821; --panel2:#16202B; --line:#223142;
    --text:#E6EDF3; --muted:#8A99A8; --blue:#0B8FD1; --blue-d:#0B5C8C;
    --orange:#D98C4A; --orange-d:#B4530F; --ok:#3FB950; --bad:#F85149;
    --mono:"JetBrains Mono",Consolas,Menlo,monospace;
    --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
  body{display:flex;flex-direction:column}

  header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  .logo{width:38px;height:38px;flex:none}
  .brand h1{margin:0;font-size:18px;letter-spacing:.3px}
  .brand h1 span{color:var(--orange)}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .status{margin-left:auto;display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--muted)}
  .led{width:10px;height:10px;border-radius:50%;background:#555;box-shadow:0 0 0 2px #0006}
  .led.up{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .led.down{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .led.busy{background:var(--orange);animation:blink .8s infinite}
  @keyframes blink{50%{opacity:.3}}
  header button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:13px;cursor:pointer}
  header button:hover{border-color:var(--blue)}

  .wrap{flex:1;display:flex;min-height:0}
  aside{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow-y:auto}
  aside h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--orange);margin:4px 0 10px}
  .chip{display:block;width:100%;text-align:left;margin:0 0 7px;padding:9px 11px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-left:3px solid var(--blue-d);border-radius:6px;font-size:13px;cursor:pointer}
  .chip:hover{border-left-color:var(--blue);background:#1b2734}
  .chip small{display:block;color:var(--muted);font:11px var(--mono);margin-top:2px}
  .topo{margin-top:18px}

  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #log{flex:1;overflow-y:auto;padding:22px 26px}
  .msg{display:flex;gap:12px;margin:0 0 18px;max-width:900px}
  .msg .tag{flex:none;font:11px var(--mono);padding:4px 7px;border-radius:4px;height:fit-content;margin-top:2px}
  .msg.user .tag{background:var(--blue-d);color:#fff}
  .msg.bot .tag{background:var(--orange-d);color:#fff}
  .msg.err .tag{background:#5a1d1d;color:#fff}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 14px;line-height:1.55;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
  .msg.user .bubble{background:#0f2333;border-color:#1c3d56}
  .msg.err .bubble{border-color:#6b2a2a;color:#ffb3ad}
  .bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
  .bubble ul,.bubble ol{margin:4px 0 8px;padding-left:22px}
  .bubble code{font:13px var(--mono);background:#0B0F14;padding:1px 5px;border-radius:4px;color:#9fd3f5}
  .bubble pre{background:#0B0F14;border-left:3.5px solid var(--blue);border-radius:4px;padding:10px 12px;overflow-x:auto;margin:8px 0;position:relative}
  .bubble pre code{background:none;padding:0;color:var(--text);white-space:pre}
  .copy{position:absolute;top:6px;right:6px;font:11px var(--mono);background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer}
  .bubble h3,.bubble h4{margin:8px 0 6px;color:var(--orange)}
  .bubble a{color:var(--blue)}
  .meta{font:11px var(--mono);color:var(--muted);margin-top:6px}
  .typing span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--orange);animation:blink 1s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}

  form{display:flex;gap:10px;padding:14px 26px 8px;border-top:1px solid var(--line);background:var(--panel)}
  .prompt{flex:1;display:flex;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px}
  .prompt:focus-within{border-color:var(--blue)}
  .prompt b{font:14px var(--mono);color:var(--ok);padding:11px 6px 0 0;white-space:nowrap}
  textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:var(--text);font:14px var(--mono);padding:11px 0;max-height:160px}
  form button{background:var(--blue-d);color:#fff;border:0;border-radius:8px;padding:0 20px;font-weight:600;cursor:pointer}
  form button:hover{background:var(--blue)}
  form button:disabled{opacity:.5;cursor:default}
  footer{text-align:center;font-size:11px;color:#888;padding:4px 0 10px;background:var(--panel)}

  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;width:min(460px,92vw);padding:20px}
  dialog::backdrop{background:#000a}
  dialog h3{margin:0 0 14px;color:var(--orange)}
  dialog label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  dialog input[type=text],dialog input[type=password]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:13px var(--mono)}
  dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  dialog .row button{padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
  dialog .row button.primary{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
  .check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}

  @media (max-width:760px){
    aside{display:none}
    #log{padding:16px}
    form{padding:12px 16px 8px}
    header{padding:10px 16px}
    .brand p{display:none}
  }
</style>
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="18" fill="#0B5C8C"/>
    <path d="M9 20h22M20 9v22" stroke="#E6EDF3" stroke-width="2.2"/>
    <path d="M12 17l-3 3 3 3M28 17l3 3-3 3M17 12l3-3 3 3M17 28l3 3 3-3" fill="none" stroke="#D98C4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="brand">
    <h1>Network<span>instructors</span></h1>
    <p>CCNA &amp; networking assistant</p>
  </div>
  <div class="status"><span class="led" id="led"></span><span id="stxt">not tested</span></div>
  <button id="newBtn" title="Start a new conversation">New chat</button>
  <button id="setBtn" title="Webhook and login">Settings</button>
</header>

<div class="wrap">
  <aside>
    <h2>Quick questions</h2>
    <button class="chip" data-q="Subnet 192.168.20.0/26: give me network, broadcast, first and last host and number of hosts.">Subnetting<small>192.168.20.0/26</small></button>
    <button class="chip" data-q="Explain the OSPF neighbor states from Down to Full with a Cisco example.">OSPF<small>neighbor states</small></button>
    <button class="chip" data-q="How do I create VLAN 20 and VLAN 30 on a Cisco switch and set up a trunk to the router?">VLANs<small>access + trunk</small></button>
    <button class="chip" data-q="Write a standard ACL that blocks 192.168.30.0/24 from reaching 192.168.20.0/24 and explain where to apply it.">ACL<small>standard vs extended</small></button>
    <button class="chip" data-q="What is the difference between eBGP and iBGP? Give a short Cisco config example.">BGP<small>eBGP vs iBGP</small></button>
    <button class="chip" data-q="Explain STP root bridge election and port roles in simple words.">STP<small>root bridge election</small></button>
    <button class="chip" data-q="What is my current public IP address?">Public IP<small>uses the ipify tool</small></button>

    <div class="topo">
      <h2>Lab</h2>
      <svg viewBox="0 0 220 120" width="100%" aria-hidden="true" font-family="Consolas,monospace" font-size="9">
        <line x1="40" y1="30" x2="110" y2="30" stroke="#185FA5" stroke-width="2"/>
        <line x1="110" y1="30" x2="180" y2="30" stroke="#185FA5" stroke-width="2"/>
        <line x1="40" y1="30" x2="40" y2="90" stroke="#185FA5" stroke-width="2"/>
        <line x1="180" y1="30" x2="180" y2="90" stroke="#185FA5" stroke-width="2"/>
        <g fill="#0B5C8C" stroke="#E6EDF3"><circle cx="40" cy="30" r="11"/><circle cx="110" cy="30" r="11"/><circle cx="180" cy="30" r="11"/></g>
        <g fill="#647687"><rect x="28" y="84" width="24" height="16" rx="2"/><rect x="168" y="84" width="24" height="16" rx="2"/></g>
        <g fill="#E6EDF3" text-anchor="middle"><text x="40" y="33">R1</text><text x="110" y="33">R2</text><text x="180" y="33">R3</text><text x="40" y="95">PC1</text><text x="180" y="95">PC2</text></g>
        <g fill="#8A99A8" text-anchor="middle"><text x="75" y="22">OSPF 0</text><text x="145" y="22">OSPF 0</text><text x="110" y="115">ask about any link</text></g>
      </svg>
    </div>
  </aside>

  <main>
    <div id="log"></div>
    <form id="f">
      <div class="prompt"><b>Networkinstructors#</b><textarea id="q" rows="1" placeholder="Ask about subnetting, OSPF, VLANs, ACLs…  (Enter = send, Shift+Enter = new line)"></textarea></div>
      <button id="send" type="submit">Send</button>
    </form>
    <footer>www.networkinstructors.com</footer>
  </main>
</div>

<dialog id="dlg">
  <h3>Connection settings</h3>
  <label for="url">n8n chat webhook URL</label>
  <input id="url" type="text" spellcheck="false">
  <label for="user">Basic Auth username</label>
  <input id="user" type="text" autocomplete="username" spellcheck="false">
  <label for="pass">Basic Auth password</label>
  <input id="pass" type="password" autocomplete="current-password">
  <div class="check"><input id="remember" type="checkbox"><label for="remember" style="margin:0">Remember login on this computer</label></div>
  <div class="row">
    <button type="button" id="testBtn">Test</button>
    <button type="button" id="cancelBtn">Cancel</button>
    <button type="button" class="primary" id="saveBtn">Save</button>
  </div>
</dialog>

<script>
const DEFAULT_URL = "http://100.111.83.35:5678/webhook/60af164e-c5b7-4623-8db0-1230b4e694fa/chat";
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

let cfg = {
  url:  store.get("nb_url")  || DEFAULT_URL,
  user: store.get("nb_user") || "",
  pass: store.get("nb_pass") || ""
};
let sessionId = store.get("nb_session") || newSession();

function newSession(){
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  store.set("nb_session", id);
  return id;
}

/* ---------- tiny, safe markdown ---------- */
function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inline(s){
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(text){
  const parts = String(text).split(/```[^\n]*\n?/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1){
      html += '<pre><button class="copy" type="button">copy</button><code>' + esc(part.replace(/\n$/, "")) + "</code></pre>";
      return;
    }
    const lines = esc(part).split("\n");
    let list = null, para = [];
    const flushP = () => { if (para.length){ html += "<p>" + inline(para.join("<br>")) + "</p>"; para = []; } };
    const flushL = () => { if (list){ html += "</" + list + ">"; list = null; } };
    for (const raw of lines){
      const line = raw.trimEnd();
      let m;
      if (!line.trim()){ flushP(); flushL(); continue; }
      if ((m = line.match(/^#{1,6}\s+(.*)/))){ flushP(); flushL(); html += "<h4>" + inline(m[1]) + "</h4>"; continue; }
      if ((m = line.match(/^\s*[-*•]\s+(.*)/))){ flushP(); if (list !== "ul"){ flushL(); html += "<ul>"; list = "ul"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))){ flushP(); if (list !== "ol"){ flushL(); html += "<ol>"; list = "ol"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
      flushL(); para.push(line);
    }
    flushP(); flushL();
  });
  return html;
}

/* ---------- chat log ---------- */
function add(role, text, meta){
  const tags = {user:"YOU", bot:"NI", err:"ERROR"};
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = '<div class="tag">' + tags[role] + '</div><div class="bubble">' +
    (role === "user" ? "<p>" + esc(text).replace(/\n/g,"<br>") + "</p>" : md(text)) +
    (meta ? '<div class="meta">' + esc(meta) + "</div>" : "") + "</div>";
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}
function typing(){
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = '<div class="tag">NI</div><div class="bubble typing"><span></span><span></span><span></span></div>';
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}
$("log").addEventListener("click", e => {
  if (!e.target.classList.contains("copy")) return;
  const code = e.target.parentElement.querySelector("code").innerText;
  navigator.clipboard.writeText(code).then(() => { e.target.textContent = "copied"; setTimeout(() => e.target.textContent = "copy", 1200); });
});

function setStatus(state, txt){
  $("led").className = "led " + state;
  $("stxt").textContent = txt;
}

/* ---------- n8n call ---------- */
function pickText(data){
  if (data == null) return "";
  if (typeof data === "string") return data;
  if (Array.isArray(data)) return pickText(data[0]);
  for (const k of ["output","text","response","message","answer","reply"]){
    if (typeof data[k] === "string") return data[k];
  }
  if (data.json) return pickText(data.json);
  return "```\n" + JSON.stringify(data, null, 2) + "\n```";
}

async function callBot(text){
  const headers = {"Content-Type":"application/json"};
  if (cfg.user || cfg.pass) headers["Authorization"] = "Basic " + btoa(unescape(encodeURIComponent(cfg.user + ":" + cfg.pass)));
  const res = await fetch(cfg.url, {
    method:"POST",
    headers,
    body: JSON.stringify({action:"sendMessage", sessionId, chatInput:text})
  });
  const raw = await res.text();
  if (!res.ok){
    let hint = "";
    if (res.status === 404) hint = "The webhook is not registered. In n8n open the workflow and click Publish (the production URL only exists for the published version).";
    if (res.status === 401 || res.status === 403) hint = "Wrong or missing Basic Auth username/password. Open Settings.";
    if (res.status >= 500) hint = "n8n received the message but the workflow failed. Check Executions in n8n.";
    throw new Error("HTTP " + res.status + (hint ? " — " + hint : "") + (raw ? "\n\nServer said: " + raw.slice(0, 300) : ""));
  }
  try { return pickText(JSON.parse(raw)); } catch(e){ return raw; }
}

async function send(text){
  text = text.trim();
  if (!text) return;
  add("user", text);
  $("q").value = ""; grow();
  $("send").disabled = true;
  setStatus("busy", "waiting for n8n…");
  const t = typing();
  const started = performance.now();
  try{
    const answer = await callBot(text);
    t.remove();
    add("bot", answer || "(empty reply)", ((performance.now() - started)/1000).toFixed(1) + " s");
    setStatus("up", "connected");
  }catch(err){
    t.remove();
    let msg = err.message;
    if (err instanceof TypeError) msg = "Could not reach n8n at " + cfg.url + "\n\nCheck: Tailscale is connected, n8n is running, and the Chat Trigger allows this origin (Allowed Origins / CORS = *).";
    add("err", msg);
    setStatus("down", "error");
  }finally{
    $("send").disabled = false;
    $("q").focus();
  }
}

/* ---------- UI wiring ---------- */
function grow(){ const q = $("q"); q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; }
$("q").addEventListener("input", grow);
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send($("q").value); } });
$("f").addEventListener("submit", e => { e.preventDefault(); send($("q").value); });
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => send(b.dataset.q)));

$("newBtn").addEventListener("click", () => {
  sessionId = newSession();
  $("log").innerHTML = "";
  welcome();
});

function openSettings(){
  $("url").value = cfg.url; $("user").value = cfg.user; $("pass").value = cfg.pass;
  $("remember").checked = !!store.get("nb_pass");
  $("dlg").showModal();
}
$("setBtn").addEventListener("click", openSettings);
$("cancelBtn").addEventListener("click", () => $("dlg").close());
function readForm(){ cfg.url = $("url").value.trim() || DEFAULT_URL; cfg.user = $("user").value; cfg.pass = $("pass").value; }
$("saveBtn").addEventListener("click", () => {
  readForm();
  store.set("nb_url", cfg.url);
  if ($("remember").checked){ store.set("nb_user", cfg.user); store.set("nb_pass", cfg.pass); }
  else { store.del("nb_user"); store.del("nb_pass"); }
  $("dlg").close();
});
$("testBtn").addEventListener("click", async () => {
  readForm();
  $("dlg").close();
  send("Reply with one short line: are you online?");
});

function welcome(){
  add("bot", "Hello! I'm **Networkinstructors**, your CCNA and networking assistant.\n\nAsk me about subnetting, VLANs, OSPF, ACLs, BGP or anything else, or pick a quick question on the left.");
}
welcome();
$("q").focus();
</script>
</body>
